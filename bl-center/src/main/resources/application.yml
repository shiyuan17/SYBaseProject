spring:
  application:
    name: bl-center
  cache:
    type: caffeine
    cache-names:
      - bodyPartTree
      - departmentTree
      - medicalOrderDictTree
      - medicalOrderChargeItems
      - samplingTemplateTree
      - samplingTemplateDetail
      - samplingGuidelineTree
      - samplingGuidelineDetail
      - systemConfigTree
      - systemConfigItems
      - numberingRules
    caffeine:
      spec: maximumSize=200,expireAfterWrite=10m

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

observability:
  logging:
    access:
      enabled: true
  metrics:
    enabled: true
    common-tags:
      module: bl-center

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
