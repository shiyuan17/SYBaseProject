services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_IMAGE_TAG}
    container_name: ${GITLAB_CONTAINER_NAME:-sybase-gitlab}
    hostname: ${GITLAB_HOSTNAME}
    restart: always
    shm_size: ${GITLAB_SHM_SIZE:-256m}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL}'
        nginx['listen_port'] = 80
        gitlab_rails['time_zone'] = '${GITLAB_TIMEZONE:-Asia/Shanghai}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        gitlab_rails['registry_enabled'] = true
        registry['enable'] = true
        registry_external_url '${GITLAB_REGISTRY_EXTERNAL_URL}'
        registry_nginx['listen_port'] = ${GITLAB_REGISTRY_PORT}
        registry_nginx['listen_https'] = false
    ports:
      - "${GITLAB_HTTP_PORT}:80"
      - "${GITLAB_HTTPS_PORT}:443"
      - "${GITLAB_SSH_PORT}:22"
      - "${GITLAB_REGISTRY_PORT}:${GITLAB_REGISTRY_PORT}"
    volumes:
      - ${GITLAB_CONFIG_DIR}:/etc/gitlab
      - ${GITLAB_LOGS_DIR}:/var/log/gitlab
      - ${GITLAB_DATA_DIR}:/var/opt/gitlab
