services:
  bl-center:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME:-sybase-bl-center}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BL_CENTER_DATASOURCE_DRIVER_CLASS_NAME: ${BL_CENTER_DATASOURCE_DRIVER_CLASS_NAME:-dm.jdbc.driver.DmDriver}
      BL_CENTER_DATASOURCE_URL: ${BL_CENTER_DATASOURCE_URL:-}
      BL_CENTER_DATASOURCE_USERNAME: ${BL_CENTER_DATASOURCE_USERNAME:-}
      BL_CENTER_DATASOURCE_PASSWORD: ${BL_CENTER_DATASOURCE_PASSWORD:-}
      SECURITY_AUTH_JWT_SM2_PRIVATE_KEY: ${SECURITY_AUTH_JWT_SM2_PRIVATE_KEY:-MIGTAgEAMBMGByqGSM49AgEGCCqBHM9VAYItBHkwdwIBAQQgFRpOClbX4u9Hpc+YDvXV7ShD1lfZk4EH0oyGF59PXQGgCgYIKoEcz1UBgi2hRANCAARrIcTZ4A4T3M55LVirPjtxhusNEndt2SmwXo5DfmQ+MHysYOCcFIOqI7YXUlrJ/e3D6owhe9Fo4nF7oZFzafRg}
      SECURITY_AUTH_JWT_SM2_PUBLIC_KEY: ${SECURITY_AUTH_JWT_SM2_PUBLIC_KEY:-MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAEayHE2eAOE9zOeS1Yqz47cYbrDRJ3bdkpsF6OQ35kPjB8rGDgnBSDqiO2F1Jayf3tw+qMIXvRaOJxe6GRc2n0YA==}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-}
      SPRING_FLYWAY_BASELINE_DESCRIPTION: ${SPRING_FLYWAY_BASELINE_DESCRIPTION:-}
      BL_REPORT_OFD_ENABLED: ${BL_REPORT_OFD_ENABLED:-true}
      BL_REPORT_OFD_WORKER_MAX_HEAP_MB: ${BL_REPORT_OFD_WORKER_MAX_HEAP_MB:-256}
      BL_REPORT_OFD_WORKER_TIMEOUT_SECONDS: ${BL_REPORT_OFD_WORKER_TIMEOUT_SECONDS:-60}
      BL_REPORT_STORAGE_ROOT: ${BL_REPORT_STORAGE_ROOT:-/data/reports}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseContainerSupport}
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-5}"
