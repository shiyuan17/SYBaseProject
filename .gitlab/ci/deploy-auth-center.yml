.deploy_auth_center:
  stage: deploy
  image: alpine:3.20
  needs:
    - image_auth_center
  variables:
    IMAGE_REPO: "$AUTH_CENTER_IMAGE_REPO"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod +x scripts/ci/deploy-auth-center.sh
  script:
    - sh scripts/ci/deploy-auth-center.sh

deploy_local_auth_center:
  extends: .deploy_auth_center
  environment:
    name: auth-local
  variables:
    DEPLOY_HOST: "$DEPLOY_LOCAL_HOST"
    DEPLOY_USER: "$DEPLOY_LOCAL_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_LOCAL_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_LOCAL_AUTH_CENTER_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_LOCAL_AUTH_CENTER_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_LOCAL_AUTH_CENTER_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_test_auth_center:
  extends: .deploy_auth_center
  needs:
    - image_auth_center
    - deploy_local_auth_center
  environment:
    name: auth-test
  variables:
    DEPLOY_HOST: "$DEPLOY_TEST_HOST"
    DEPLOY_USER: "$DEPLOY_TEST_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_TEST_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_TEST_AUTH_CENTER_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_TEST_AUTH_CENTER_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_TEST_AUTH_CENTER_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: false

deploy_staging_auth_center:
  extends: .deploy_auth_center
  environment:
    name: auth-staging
  variables:
    DEPLOY_HOST: "$DEPLOY_STAGING_HOST"
    DEPLOY_USER: "$DEPLOY_STAGING_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_STAGING_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_STAGING_AUTH_CENTER_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_STAGING_AUTH_CENTER_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_STAGING_AUTH_CENTER_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
      when: manual
      allow_failure: false

deploy_prod_auth_center:
  extends: .deploy_auth_center
  environment:
    name: auth-production
  variables:
    DEPLOY_HOST: "$DEPLOY_PROD_HOST"
    DEPLOY_USER: "$DEPLOY_PROD_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_PROD_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_PROD_AUTH_CENTER_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_PROD_AUTH_CENTER_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_PROD_AUTH_CENTER_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
      when: manual
      allow_failure: false
