global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: user-center
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-center:8080
        labels:
          service: user-center
          env: local
