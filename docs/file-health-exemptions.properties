version=1

exemption.1.glob=docs/database/*.sql
exemption.1.waive=MAX_LINES,MAX_SIZE
exemption.1.reason=Historical database reference scripts stay consolidated for traceability and deployment diff review; keep them intact until the SQL reference set is moved into versioned, topic-scoped bundles.

exemption.2.glob=infrastructure/monitor/grafana/dashboards/*.json
exemption.2.waive=MAX_LINES,MAX_SIZE
exemption.2.reason=Grafana dashboard exports are machine-generated artifacts; keep the raw export shape until dashboard provisioning switches to a templated source plus generated output flow.

exemption.3.glob=docs/plans/*.md
exemption.3.waive=MAX_LINES
exemption.3.reason=Planning documents are maintained as complete narrative artifacts; keep them whole until the milestone archive flow moves historical plans into dated subpackages with summary indexes.
