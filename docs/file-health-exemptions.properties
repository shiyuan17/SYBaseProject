version=1

exemption.1.glob=docs/database/*.sql
exemption.1.waive=MAX_LINES,MAX_SIZE
exemption.1.reason=Historical database reference scripts stay consolidated for traceability and deployment diff review; keep them intact until the SQL reference set is moved into versioned, topic-scoped bundles.

exemption.2.glob=infrastructure/monitor/grafana/dashboards/*.json
exemption.2.waive=MAX_LINES,MAX_SIZE
exemption.2.reason=Grafana dashboard exports are machine-generated artifacts; keep the raw export shape until dashboard provisioning switches to a templated source plus generated output flow.

exemption.3.glob=docs/plans/*.md
exemption.3.waive=MAX_LINES
exemption.3.reason=Planning documents are maintained as complete narrative artifacts; keep them whole until the milestone archive flow moves historical plans into dated subpackages with summary indexes.

exemption.4.glob=bl-center/src/main/java/com/company/bl/application/service/TechnicalSpecimenRegistrationService.java
exemption.4.waive=MAX_LINES
exemption.4.reason=The technical specimen registration workflow still spans several legacy sub-flows in one application service; keep the current consolidation until the planned M3 registration slice extraction lands.

exemption.5.glob=bl-center/src/test/java/com/company/bl/interfaces/SpecimenWorkflowClosureIntegrationTest.java
exemption.5.waive=MAX_LINES
exemption.5.reason=This end-to-end closure regression suite intentionally keeps the full specimen workflow in one fixture while the workflow test package is being split by milestone stage.

exemption.6.glob=scripts/ci/generate-code-health-checklist.ps1
exemption.6.waive=MAX_LINES
exemption.6.reason=The checklist generator remains a single script so CI and local review use one authoritative rendering path until shared PowerShell helpers are introduced.

exemption.7.glob=scripts/ci/generate-code-health-report.ps1
exemption.7.waive=MAX_LINES
exemption.7.reason=The PowerShell report generator still centralizes parsing, scoring, and rendering for Windows-first CI usage; keep it intact until the reporting pipeline is modularized.

exemption.8.glob=scripts/ci/generate-code-health-report.sh
exemption.8.waive=MAX_LINES
exemption.8.reason=The shell report generator mirrors the PowerShell implementation for parity across local environments and remains consolidated until the shared reporting core is extracted.

exemption.9.glob=bl-center/src/main/java/com/company/bl/infrastructure/persistence/JdbcTechnicalWorkflowProcessingQueries.java
exemption.9.waive=MAX_LINES
exemption.9.reason=The technical processing query set still centralizes slicing workbench aggregation and media/tracking reads in one adapter; keep it consolidated until the processing query package is split by workbench, tracking, and media read models.

exemption.10.glob=bl-center/src/test/java/com/company/bl/interfaces/MedicalOrderIntegrationTest.java
exemption.10.waive=MAX_LINES
exemption.10.reason=This integration suite intentionally keeps the full medical-order workflow regression coverage in one fixture while the M4 order scenarios are being separated into targeted test classes.

exemption.11.glob=bl-center/src/test/java/com/company/bl/interfaces/TechnicalWorkflowQueryEnhancementIntegrationTest.java
exemption.11.waive=MAX_LINES
exemption.11.reason=This query regression suite keeps the cross-workstation filtering and tracking assertions together until the technical query coverage is split by pending list, workbench, and tracking read models.

exemption.12.glob=scripts/database/run-database-export.cmd
exemption.12.waive=MAX_LINES
exemption.12.reason=The Windows database export entrypoint currently keeps environment discovery, deduplication, and export orchestration in one script so local operators can audit a single flow before the database backup tooling is modularized.
