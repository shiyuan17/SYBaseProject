workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - image
  - deploy

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  USER_CENTER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/user-center"

cache:
  key: "$CI_PROJECT_ID-maven"
  paths:
    - .m2/repository

verify:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - chmod +x mvnw
    - ./mvnw -B -ntp clean test

package_user_center:
  stage: package
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - verify
  script:
    - chmod +x mvnw
    - ./mvnw -pl user-center -am package -DskipTests
  artifacts:
    name: "user-center-$CI_COMMIT_SHORT_SHA"
    paths:
      - user-center/target/*.jar
    expire_in: 7 days

image_user_center:
  stage: image
  image: docker:27.0.3-cli
  needs:
    - package_user_center
  services:
    - name: docker:27.0.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REPO: "$USER_CENTER_IMAGE_REPO"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    EXTRA_IMAGE_TAGS: "$CI_COMMIT_REF_SLUG $CI_COMMIT_TAG"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - chmod +x scripts/ci/build-user-center-image.sh
  script:
    - sh scripts/ci/build-user-center-image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

.deploy_user_center:
  stage: deploy
  image: alpine:3.20
  needs:
    - image_user_center
  variables:
    IMAGE_REPO: "$USER_CENTER_IMAGE_REPO"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod +x scripts/ci/deploy-user-center.sh
  script:
    - sh scripts/ci/deploy-user-center.sh

deploy_test:
  extends: .deploy_user_center
  environment:
    name: test
  variables:
    DEPLOY_HOST: "$DEPLOY_TEST_HOST"
    DEPLOY_USER: "$DEPLOY_TEST_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_TEST_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_TEST_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_TEST_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_TEST_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy_staging:
  extends: .deploy_user_center
  environment:
    name: staging
  variables:
    DEPLOY_HOST: "$DEPLOY_STAGING_HOST"
    DEPLOY_USER: "$DEPLOY_STAGING_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_STAGING_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_STAGING_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_STAGING_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_STAGING_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
      when: manual
      allow_failure: false

deploy_prod:
  extends: .deploy_user_center
  environment:
    name: production
  variables:
    DEPLOY_HOST: "$DEPLOY_PROD_HOST"
    DEPLOY_USER: "$DEPLOY_PROD_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_PROD_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_PROD_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_PROD_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_PROD_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
      when: manual
      allow_failure: false
