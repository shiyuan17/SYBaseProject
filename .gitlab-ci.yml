workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - image
  - deploy

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  AUTH_CENTER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/auth-center"
  BL_CENTER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/bl-center"
  USER_CENTER_IMAGE_REPO: "$CI_REGISTRY_IMAGE/user-center"

cache:
  key: "$CI_PROJECT_ID-maven"
  paths:
    - .m2/repository

verify_fast:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - chmod +x mvnw
    - ./mvnw -B -ntp clean test "-Dsurefire.excludedGroups=slow"

verify_full:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - chmod +x mvnw
    - ./mvnw -B -ntp clean verify

verify_m1_m5_api_regression:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  variables:
    TZ: Asia/Shanghai
  script:
    - chmod +x mvnw
    - chmod +x scripts/ci/run-m1-m5-api-regression.sh
    - bash scripts/ci/run-m1-m5-api-regression.sh
  artifacts:
    when: always
    name: "m1-m5-api-regression-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs/reports/m1-m5-api-test-report-*.md
      - auth-center/target/surefire-reports/
      - user-center/target/surefire-reports/
      - bl-center/target/surefire-reports/
    reports:
      junit:
        - auth-center/target/surefire-reports/TEST-*.xml
        - user-center/target/surefire-reports/TEST-*.xml
        - bl-center/target/surefire-reports/TEST-*.xml
    expire_in: 14 days

package_user_center:
  stage: package
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - verify_fast
    - verify_full
    - verify_m1_m5_api_regression
  script:
    - chmod +x mvnw
    - ./mvnw -pl user-center -am package -DskipTests
  artifacts:
    name: "user-center-$CI_COMMIT_SHORT_SHA"
    paths:
      - user-center/target/*.jar
    expire_in: 7 days

package_auth_center:
  stage: package
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - verify_fast
    - verify_full
    - verify_m1_m5_api_regression
  script:
    - chmod +x mvnw
    - ./mvnw -pl auth-center -am package -DskipTests
  artifacts:
    name: "auth-center-$CI_COMMIT_SHORT_SHA"
    paths:
      - auth-center/target/*.jar
    expire_in: 7 days

package_bl_center:
  stage: package
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - verify_fast
    - verify_full
    - verify_m1_m5_api_regression
  script:
    - chmod +x mvnw
    - ./mvnw -pl bl-center -am package -DskipTests
  artifacts:
    name: "bl-center-$CI_COMMIT_SHORT_SHA"
    paths:
      - bl-center/target/*.jar
    expire_in: 7 days

image_user_center:
  stage: image
  image: docker:27.0.3-cli
  needs:
    - package_user_center
  services:
    - name: docker:27.0.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REPO: "$USER_CENTER_IMAGE_REPO"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    EXTRA_IMAGE_TAGS: "$CI_COMMIT_REF_SLUG $CI_COMMIT_TAG"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - chmod +x scripts/ci/build-user-center-image.sh
  script:
    - sh scripts/ci/build-user-center-image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

image_auth_center:
  stage: image
  image: docker:27.0.3-cli
  needs:
    - package_auth_center
  services:
    - name: docker:27.0.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REPO: "$AUTH_CENTER_IMAGE_REPO"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    EXTRA_IMAGE_TAGS: "$CI_COMMIT_REF_SLUG $CI_COMMIT_TAG"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - chmod +x scripts/ci/build-auth-center-image.sh
  script:
    - sh scripts/ci/build-auth-center-image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

image_bl_center:
  stage: image
  image: docker:27.0.3-cli
  needs:
    - package_bl_center
  services:
    - name: docker:27.0.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_REPO: "$BL_CENTER_IMAGE_REPO"
    IMAGE_TAG: "$CI_COMMIT_SHA"
    EXTRA_IMAGE_TAGS: "$CI_COMMIT_REF_SLUG $CI_COMMIT_TAG"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - chmod +x scripts/ci/build-bl-center-image.sh
  script:
    - sh scripts/ci/build-bl-center-image.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'

.deploy_auth_center:
  stage: deploy
  image: alpine:3.20
  needs:
    - image_auth_center
  variables:
    IMAGE_REPO: "$AUTH_CENTER_IMAGE_REPO"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod +x scripts/ci/deploy-auth-center.sh
  script:
    - sh scripts/ci/deploy-auth-center.sh

.deploy_bl_center:
  stage: deploy
  image: alpine:3.20
  needs:
    - image_bl_center
  variables:
    IMAGE_REPO: "$BL_CENTER_IMAGE_REPO"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod +x scripts/ci/deploy-bl-center.sh
  script:
    - sh scripts/ci/deploy-bl-center.sh

.deploy_user_center:
  stage: deploy
  image: alpine:3.20
  needs:
    - image_user_center
  variables:
    IMAGE_REPO: "$USER_CENTER_IMAGE_REPO"
