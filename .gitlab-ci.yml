    DEPLOY_USER: "$DEPLOY_LOCAL_USER"
    DEPLOY_SSH_KEY: "$DEPLOY_LOCAL_SSH_KEY"
    DEPLOY_APP_DIR: "$DEPLOY_LOCAL_APP_DIR"
    DEPLOY_PORT: "$DEPLOY_LOCAL_PORT"
    DEPLOY_SPRING_PROFILE: "$DEPLOY_LOCAL_SPRING_PROFILE"
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

