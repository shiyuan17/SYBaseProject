    - chmod 644 ~/.ssh/known_hosts
    - chmod +x scripts/ci/deploy-user-center.sh
  script:
    - sh scripts/ci/deploy-user-center.sh

deploy_local:
  extends: .deploy_user_center
  environment:
    name: local
